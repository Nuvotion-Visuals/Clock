      font-family: 'Nuvo';
      src: url('Nuvo.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;

    :root {
      --Background: black;

    body {

      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;

    .hours {
      background-color: transparent;
      border: none;
      font-weight: 600 !important;
      color: #E0E1E1;
      letter-spacing: .2em;
      font-size: 30px;
    }

    .minutes {
      background-color: transparent;
      border: none;
      font-weight: 400 !important;
      font-size: 6px;
      background: var(--Background);
      color: gray;
      letter-spacing: .1em;

    }

    .big-needle {
      height: 3px;
      border-radius: 2px;
    }

    .clock > .center {
      border: 3px solid #E0E1E1;
      background-color: var(--Background);
    }
  
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: 50% 100%;
      background: #E0E1E1;
      clip-path: polygon(40% 0, 60% 0, 80% 100%, 20% 100%);
    }

    .hour-hand {
      width: 10px;
      height: 82px;
      transform-origin: 5px 100%;
      margin-left: -5px;
    }

    .minute-hand {
      width: 5px;
      height: 122px;
      transform-origin: 2.5px 100%;
      margin-left: -2.5px;
    }

    .second-hand {
      width: 3px;
      height: 122px;
      background: #E60E00;
      transform-origin: 1.5px 100%;
      margin-left: -1.5px;
    }

    .clock {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
    }

    .clock > .center {
      border: 3px solid #E0E1E1;
      background-color: var(--Background);
      width: 12px;
      height: 12px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 10;
    }

    .day {
      font-size: 20px;
      letter-spacing: .1em;
    }

    .inner {
      border: none;
    }

  <script src="orbit.min.js"></script>
  <script>
    function analogWatch() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();
      const day = now.getDate();

      // Set current day
      const dayElement = document.querySelector('.day');
      dayElement.textContent = day;

      // Hour hand: (360° / 12) = 30° per hour
      // Each minute adds (30° / 60) = 0.5° 
      // Each second adds (0.5° / 60) = 0.008333...°
      // Each millisecond adds (0.008333...° / 1000) = 0.000008333...°
      const hourAngle = (hours % 12) * 30 + 
                        minutes * 0.5 + 
                        seconds * (0.5 / 60) + 
                        milliseconds * (0.5 / 60 / 1000);

      // Minute hand: (360° / 60) = 6° per minute
      // Each second adds (6° / 60) = 0.1°
      // Each millisecond adds (0.1° / 1000) = 0.0001°
      const minuteAngle = minutes * 6 + 
                          seconds * (6 / 60) + 
                          milliseconds * (6 / 60 / 1000);

      // Second hand: (360° / 60) = 6° per second, no fractional movement
      const secondAngle = seconds * 6;

      const hourHand = document.querySelector(".xh");
      const minuteHand = document.querySelector(".xm");
      const secondHand = document.querySelector(".xs");

      hourHand.style.transform = `rotate(${hourAngle}deg)`;
      minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
      secondHand.style.transform = `rotate(${secondAngle}deg)`;
    }

    // Update hour and minute hands every frame
    const smoothUpdate = () => {
      const now = new Date();
      // Only update if we're not exactly on a second boundary
      if (now.getMilliseconds() > 0) {
        analogWatch();
      }
      requestAnimationFrame(smoothUpdate);
    };

    // Update second hand exactly on the second
    setInterval(() => {
      const now = new Date();
      if (now.getMilliseconds() === 0) {
        analogWatch();
      }
    }, 1000);

    // Start both update cycles
    analogWatch();
    smoothUpdate();
  </script>
