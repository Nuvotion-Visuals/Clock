  <style>
    @font-face {
      font-family: 'Nuvo';
      src: url('Nuvo.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --Background: black;
    }

    body {
      font-family: 'Nuvo';
      background: var(--Background);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    .hours {
      background-color: transparent;
      border: none;
      font-weight: 600 !important;
      color: #E0E1E1;
      letter-spacing: .2em;
      font-size: 30px;
    }

    .minutes {
      background-color: transparent;
      border: none;
      font-weight: 400 !important;
      font-size: 6px;
      background: var(--Background);
      color: gray;
      letter-spacing: .1em;

    }

    .big-needle {
      height: 3px;
      border-radius: 2px;
    }

    .clock > .center {
      border: 3px solid #E0E1E1;
      background-color: var(--Background);
    }
  
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: 50% 100%;
      background: #E0E1E1;
      clip-path: polygon(40% 0, 60% 0, 80% 100%, 20% 100%);
    }

    .hour-hand {
      width: 10px;
      height: 82px;
      transform-origin: 5px 100%;
      margin-left: -5px;
    }

    .minute-hand {
      width: 5px;
      height: 122px;
      transform-origin: 2.5px 100%;
      margin-left: -2.5px;
    }

    .second-hand {
      width: 3px;
      height: 122px;
      background: #E60E00;
      transform-origin: 1.5px 100%;
      margin-left: -1.5px;
      transition: transform 0.3s cubic-bezier(0.25, 1.5, 0.5, 1);
    }

    .clock {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
    }

    .clock > .center {
      border: 3px solid #E0E1E1;
      background-color: var(--Background);
      width: 12px;
      height: 12px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 10;
    }

    .day, .month, .weekday {
      font-size: 16px;
      letter-spacing: .1em;
    }

    .inner {
      border: none;
    }

    .weather {
      display: flex;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 400;
      justify-content: center;
      letter-spacing: .2em;
      gap: .25rem;
    }

    .weather-icon {
      font-size: 16px;
    }

    .weather-current {
      display: flex;
      gap: .25rem;
    }

    .temp {
      display: flex;
    }

    _::-webkit-full-page-media, _:future, .hours {
      letter-spacing: .07em !important;
    }
  
    @keyframes antiBurnIn {
      0% {
        transform: translate(0px, 0px);
      }
      25% {
        transform: translate(12px, 12px);
      }
      50% {
        transform: translate(0px, 12px);
      }
      75% {
        transform: translate(-12px, 0px);
      }
      100% {
        transform: translate(0px, 0px);
      }
    }

    .burn-in-protection {
      animation: antiBurnIn 600s infinite ease-in-out;
    }

    .burn-in-indicator {
      width: 2px;
      height: 2px;
      background-color: #121212;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .burn-in-protection .burn-in-indicator {
      opacity: 0.5;
    }
  
  </style>
</head>

  <script src="orbit.min.js"></script>
  <script>
    function analogWatch() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();
      const day = now.getDate();
      const month = now.toLocaleString('en-US', { month: 'short' });
      const weekday = now.toLocaleString('en-US', { weekday: 'short' });

      // Set current day
      const dayElement = document.querySelector('.day');
      dayElement.textContent = day;

      // Set current month
      const monthElement = document.querySelector('.month');
      monthElement.textContent = month;

      // Set current weekday
      const weekdayElement = document.querySelector('.weekday');
      weekdayElement.textContent = weekday;

      const hourAngle = (hours % 12) * 30 + 
                        minutes * 0.5 + 
                        seconds * (0.5 / 60) + 
                        milliseconds * (0.5 / 60 / 1000);

      const minuteAngle = minutes * 6 + 
                          seconds * (6 / 60) + 
                          milliseconds * (6 / 60 / 1000);

      // For seconds, use the total minutes within the current hour plus seconds
      const totalSeconds = ((minutes % 60) * 60 + seconds) + (hours * 3600);
      const secondAngle = totalSeconds * 6;

      const hourHand = document.querySelector(".xh");
      const minuteHand = document.querySelector(".xm");
      const secondHand = document.querySelector(".xs");

      hourHand.style.transform = `rotate(${hourAngle}deg)`;
      minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
      secondHand.style.transform = `rotate(${secondAngle}deg)`;
    }

    // Update hour and minute hands every frame
    const smoothUpdate = () => {
      const now = new Date();
      // Only update if we're not exactly on a second boundary
      if (now.getMilliseconds() > 0) {
        analogWatch();
      }
      requestAnimationFrame(smoothUpdate);
    };

    // Update second hand exactly on the second
    setInterval(() => {
      const now = new Date();
      if (now.getMilliseconds() === 0) {
        analogWatch();
      }
    }, 1000);

    // Start both update cycles
    analogWatch();
    smoothUpdate();
    
    async function getWeather(latitude, longitude) {
      try {
        // Default to Chicago coordinates if geolocation fails
        const lat = latitude || 41.8781;
        const lon = longitude || -87.6298;

        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&temperature_unit=fahrenheit`);
        const data = await response.json();

        const weatherIcons = {
          0: 'fa-sun', // Clear
          1: 'fa-sun', // Mostly Clear
          2: 'fa-cloud-sun', // Partly Cloudy
          3: 'fa-cloud', // Cloudy
          45: 'fa-smog', // Foggy
          48: 'fa-smog', // Foggy
          51: 'fa-cloud-rain', // Light Rain
          53: 'fa-cloud-rain', // Rain
          55: 'fa-cloud-showers-heavy', // Heavy Rain
          61: 'fa-cloud-rain', // Light Rain
          63: 'fa-cloud-rain', // Rain
          65: 'fa-cloud-showers-heavy', // Heavy Rain
          71: 'fa-snowflake', // Snow
          73: 'fa-snowflake', // Snow
          75: 'fa-snowflake', // Heavy Snow
          77: 'fa-snowflake', // Snow
          80: 'fa-cloud-rain', // Rain
          81: 'fa-cloud-rain', // Rain
          82: 'fa-cloud-showers-heavy', // Heavy Rain
          85: 'fa-snowflake', // Snow
          86: 'fa-snowflake', // Heavy Snow
          95: 'fa-bolt', // Thunderstorm
          96: 'fa-bolt', // Thunderstorm
          99: 'fa-bolt' // Thunderstorm
        };

        const weatherIcon = document.querySelector('.weather-icon i');
        const currentTemp = document.querySelector('.temp');
        const highTemp = document.querySelector('.temp.high');
        const lowTemp = document.querySelector('.temp.low');

        // Update the icon class
        weatherIcon.className = `fa-solid ${weatherIcons[data.current.weather_code] || 'fa-cloud'}`;
        
        currentTemp.textContent = `${Math.round(data.current.temperature_2m)}°`;
        highTemp.textContent = `H:${Math.round(data.daily.temperature_2m_max[0])}°`;
        lowTemp.textContent = `L:${Math.round(data.daily.temperature_2m_min[0])}°`;
      } 
      catch (error) {
        console.error('Error fetching weather:', error);
      }
    }

    function updateWeather() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          position => {
            const { latitude, longitude } = position.coords;
            getWeather(latitude, longitude);
          },
          error => {
            // On error, fall back to Chicago
            console.warn('Geolocation failed, using Chicago as default:', error);
            getWeather(); // Will use default Chicago coordinates
          },
          {
            enableHighAccuracy: false,
            timeout: 5000,
            maximumAge: 300000
          }
        );
      } else {
        // Geolocation not supported, use Chicago
        console.warn('Geolocation not supported, using Chicago as default');
        getWeather();
      }
    }

    updateWeather();
    setInterval(updateWeather, 30 * 60 * 1000);

    // Fullscreen toggle function
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Add double-click handler to the document
    document.addEventListener('dblclick', toggleFullscreen);

    let isHighContrast = false;
    let isBurnInProtection = false;

    document.addEventListener('keydown', (event) => {
      if (event.key === 'c' || event.key === 'C') {
        isHighContrast = !isHighContrast;
        const secondHand = document.querySelector('.second-hand');
        if (secondHand) {
          secondHand.style.background = isHighContrast ? '#E0E1E1' : '#E60E00';
        }
      } else if (event.key === 'b' || event.key === 'B') {
        isBurnInProtection = !isBurnInProtection;
        const clockFrame = document.querySelector('.clock-frame');
        if (clockFrame) {
          if (isBurnInProtection) {
            clockFrame.classList.add('burn-in-protection');
          } else {
            clockFrame.classList.remove('burn-in-protection');
          }
        }
      }
    });
  </script>
